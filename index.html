<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Media Gallery App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    #uploadForm {
      margin-bottom: 20px;
    }
    #gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .media-item {
      max-width: 200px;
      cursor: pointer;
      border: 1px solid #ccc;
      padding: 5px;
    }
    .media-item img, .media-item video {
      width: 100%;
      height: auto;
    }
    #lightbox {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
    }
    #lightbox-content {
      max-width: 90%;
      max-height: 90%;
    }
  </style>
</head>
<body>

<h1>Media Gallery App</h1>

<form id="uploadForm">
  <input type="file" id="mediaUpload" multiple accept="image/*,video/*" />
</form>

<div id="gallery"></div>

<!-- Lightbox for viewing media -->
<div id="lightbox">
  <div id="lightbox-content"></div>
</div>

<script>
  const uploadInput = document.getElementById('mediaUpload');
  const gallery = document.getElementById('gallery');
  const lightbox = document.getElementById('lightbox');
  const lightboxContent = document.getElementById('lightbox-content');

  // Handle file uploads
  uploadInput.addEventListener('change', () => {
    const files = uploadInput.files;
    for (let file of files) {
      const url = URL.createObjectURL(file);
      const mediaDiv = document.createElement('div');
      mediaDiv.className = 'media-item';

      if (file.type.startsWith('image')) {
        const img = document.createElement('img');
        img.src = url;
        mediaDiv.appendChild(img);
      } else if (file.type.startsWith('video')) {
        const video = document.createElement('video');
        video.src = url;
        video.controls = true;
        mediaDiv.appendChild(video);
      }

      // Add click event to open in lightbox
      mediaDiv.addEventListener('click', () => {
        openLightbox(file.type, url);
      });

      gallery.appendChild(mediaDiv);
    }
    // Reset input
    uploadInput.value = '';
  });

  // Open media in lightbox
  function openLightbox(type, src) {
    lightboxContent.innerHTML = '';
    if (type.startsWith('image')) {
      const img = document.createElement('img');
      img.src = src;
      img.style.maxWidth = '100%';
      img.style.maxHeight = '100%';
      lightboxContent.appendChild(img);
    } else if (type.startsWith('video')) {
      const video = document.createElement('video');
      video.src = src;
      video.controls = true;
      video.style.width = '100%';
      lightboxContent.appendChild(video);
    }
    lightbox.style.display = 'flex';
  }

  // Close lightbox on click
  lightbox.addEventListener('click', () => {
    lightbox.style.display = 'none';
  });
</script>

</body>
</html>
